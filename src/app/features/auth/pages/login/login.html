<section class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="entrar()">
    <div>
      <h2>Entrar</h2>
      <p>Acesse o API Cursos com sua conta.</p>
    </div>

    @if (mensagemErro) {
      <div class="alert-error">{{ mensagemErro }}</div>
    }
    @if (cadastroRealizado) {
      <div class="alert-success">Conta criada. Agora faça login.</div>
    }
    @if (sessaoExpirada) {
      <div class="alert-warning">Sua sessão expirou. Entre novamente para continuar.</div>
    }

    <label>
      Usuário
      <input type="text" formControlName="username" autocomplete="username">
    </label>

    <label>
      Senha
      <input type="password" formControlName="password" autocomplete="current-password">
    </label>

    <button class="button-primary" type="submit" [disabled]="carregando">
      {{ carregando ? 'Entrando...' : 'Entrar' }}
    </button>
    <p class="register-link">Não possui uma conta? <a routerLink="/cadastro">Cadastre-se</a></p>
  </form>
</section>
